[package]
name = "ai-review"
version = "0.1.0"
description = "Magit-style code-review tool for LLM-agent diffs"
edition = "2021"
rust-version = "1.78"

[lib]
name = "ai_review_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.19"
sha2 = "0.10"
nucleo-matcher = "0.3"

[dev-dependencies]
tempfile = "3"
