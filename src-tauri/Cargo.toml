[package]
name = "review-me"
version = "0.1.0"
description = "Keyboard-driven code review for changes written by AI agents"
authors = ["mauricio-ms"]
license = "MIT"
repository = "https://github.com/mauricio-ms/review-me"
homepage = "https://github.com/mauricio-ms/review-me"
edition = "2021"
rust-version = "1.78"

[lib]
name = "review_me_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
git2 = "0.19"
sha2 = "0.10"
nucleo-matcher = "0.3"
regex = "1"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
streaming-iterator = "0.1"
tempfile = "3"
tauri-plugin-clipboard-manager = "=2.3.0"
